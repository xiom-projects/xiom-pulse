name: PULSE CI

# Tier 1: every pull request + manual dispatch (the org model: heavy soaks
# live in heavy.yml, releases in release.yml). Consumes the pinned,
# SHA256-verified XIOM toolchain and the stdlib checkout at STDLIB_VERSION
# via .github/actions/setup-xiom; the fleet is suites x2 + the HTTP smoke
# on both platforms.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  XIOM_TOOLCHAIN_VERSION: "v0.65.6"
  XIOM_LINUX_SHA256: "a8fc6668163e5dd87d2516483d31a3a0f614c8a3ef6ecfb790e6dfc8b7e4ce5d"
  XIOM_LINUX_ARM64_SHA256: "dca04f072414121c806701a6f989f5709c5f69e0cd4dc9158c8475142ef328d8"
  XIOM_WINDOWS_SHA256: "a52b8cf3a1dd406a13d51069acfde12ac86f75e2deecfa98e6b815890bf9f886"
  XIOM_MACOS_X64_SHA256: "c5f0eb0b4aff9c92ae75548d566f181012cd844e1a2e9ce24f70e25ea09e47ab"
  XIOM_MACOS_ARM64_SHA256: "0fc5c6cde3d6e115b831bfc5481a1d6067bd65c699619e78d405519ad5d2ca1c"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # v0.65.6 clears the Int64 extern-arg width (@fseek) and the socket ABI;
    # every leg gates, including linux-arm64 and macOS arm64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-22.04-arm
          - os: windows-latest
          - os: macos-15
          - os: macos-15-intel
    steps:
      - name: Checkout PULSE
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup XIOM (toolchain + stdlib + deps)
        uses: ./.github/actions/setup-xiom
        with:
          cross-repo-token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh src/server.xi --name pulse_app --timeout-sec 300

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& scripts\build.ps1 src\server.xi -Name pulse_app -TimeoutSec 600'

      # PR memory-retention gate (see the Linux x64 block for the budget).
      - name: Build memory-gate server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts\build.ps1 src\server.xi -Name ci_gate_server -TimeoutSec 600
          if ($LASTEXITCODE -ne 0) { throw "memory-gate build failed with exit $LASTEXITCODE" }

      - name: Memory retention gate (Windows, <= 25 KiB/req)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts\rss_gate.py --exe .\out\ci_gate_server.exe --port 18310 --seconds 75
          if ($LASTEXITCODE -ne 0) { throw "rss gate failed with exit $LASTEXITCODE" }

      - name: OpenAPI contract drift (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\out\pulse_app.exe openapi --check
          if ($LASTEXITCODE -ne 0) { throw "openapi --check failed with exit $LASTEXITCODE" }

      - name: Verify arm64 binary (Linux arm64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          file out/pulse_app | tee /tmp/pulse-arm64-file.txt
          grep -q "ARM aarch64" /tmp/pulse-arm64-file.txt

      # PR memory-retention gate (docs/FEATURE-TESTS.md section 11 risk 1 /
      # ROADMAP WP1). Unique build name + port so it cannot collide with other
      # steps or the out/pulse_app the fleet uses. Budget: 25 KiB/request
      # steady state on GET /health (current baseline ~14.5-15.5; this catches the
      # 1704-class per-request regressions, not the final flat gate). The
      # steady slope is Theil-Sen over the 2nd sample onward; OLS is reported
      # too, and the gate fails only when both exceed the budget, so one
      # noisy sample cannot turn a green run red.
      - name: Build memory-gate server (Linux x64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: bash scripts/build.sh src/server.xi --name ci_gate_server --timeout-sec 300

      - name: Memory retention gate (Linux x64, <= 25 KiB/req)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: python3 scripts/rss_gate.py --exe ./out/ci_gate_server --port 18310 --seconds 75

      - name: SQLite linkage probe (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/probes/probe_sqlite.xi --name probe_sqlite --timeout-sec 600
          ./out/probe_sqlite

      - name: Migrations runner tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/test_migrations.xi --name test_migrations --timeout-sec 600
          ./out/test_migrations

      - name: SQL store tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/test_sql.xi --name test_sql --timeout-sec 900
          ./out/test_sql

      - name: Build bttger benchmark app (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh benchmarks/bttger/main.xi --name bench_bttger --timeout-sec 300

      - name: Stream unit tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/test_stream.xi --name test_stream --timeout-sec 300
          ./out/test_stream

      - name: Suites x2 + smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for r in 1 2; do
            for s in test_http test_app test_smoke; do
              bash scripts/run.sh "tests/$s.xi" --quiet --timeout-sec 300
            done
          done
          bash scripts/http_smoke.sh --port 18090
          bash scripts/stream_smoke.sh --port 18097 --server-exe ./out/pulse_app

      - name: Dynamic site smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/site_smoke.sh --port 18095

      - name: Parser fuzz gate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/fuzz_parsers.sh --timeout 300

      - name: Cookie/auth fuzz gate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/fuzz_cookie.sh --timeout 300 --allow-known-crlf

      - name: N-port worker smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/worker_smoke.sh

      - name: App scaffold smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/scaffold_smoke.py

      # Quick wins from docs/FEATURE-TESTS.md section 12: convert existing
      # release/manual evidence into PR gates. Ports are unique (18301..18304)
      # so these steps can run back-to-back on one runner. rate/crash/KV and
      # the package probes run on the Linux legs; openapi + ws-auth cover all
      # Unix legs; macOS keeps its existing fleet.
      # Deliberately not wired here: proxy_e2e (needs an external HTTP/HTTPS
      # proxy fixture PR CI does not provision; stays manual/release), and the
      # strict-NUL fuzz corpus + session/OpenAPI fuzz targets (new tests, not
      # existing evidence). The 1M-request/24h soaks stay in heavy.yml.
      - name: OpenAPI contract drift (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./out/pulse_app openapi --check

      - name: Rate limiter smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/rate_smoke.sh --port 18301

      - name: Crash/reopen test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/crash_test.sh --port 18302

      - name: Stream auth smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" scripts/ws_auth_smoke.py --exe ./out/pulse_app --port 18303

      - name: Package probes (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for p in probe_pkg_static probe_pkg_kv probe_outbound_guard probe_audit_rotate; do
            bash scripts/build.sh "tests/probes/$p.xi" --name "$p" --timeout-sec 300
            "./out/$p"
          done

      - name: KV store suite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe-logs/ci-kv-store
          PULSE_STORE_BACKEND=kv PULSE_KV_DIR="$PWD/probe-logs/ci-kv-store" \
            bash scripts/store_soak.sh --seconds 60 --port 18304

      - name: SBOM (generate + validate)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sbom.py --out sbom/xiom-pulse.cdx.json --fetch-hashes
          python3 - <<'PY'
          import json
          d = json.load(open("sbom/xiom-pulse.cdx.json", encoding="utf-8"))
          assert d["bomFormat"] == "CycloneDX"
          assert d["specVersion"] == "1.5"
          assert d["metadata"]["component"]["name"] == "xiom-pulse"
          assert len(d["components"]) >= 10
          print("sbom: valid", len(d["components"]), "components")
          PY

      - name: Reproducible build (same-host payload)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: bash scripts/repro_check.sh --timeout 300

      - name: Suites x2 + smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($r in 1, 2) {
            foreach ($s in @("test_http", "test_app", "test_smoke")) {
              & scripts\run.ps1 "tests\$s.xi" -Quiet
              if ($LASTEXITCODE -ne 0) { throw "suite $s (round $r) failed with exit $LASTEXITCODE" }
            }
          }
          & scripts\http_smoke.ps1 -Port 18090
          if ($LASTEXITCODE -ne 0) { throw "smoke failed with exit $LASTEXITCODE" }
          & scripts\build.ps1 tests\test_stream.xi -Name test_stream -TimeoutSec 300
          if ($LASTEXITCODE -ne 0) { throw "stream unit test build failed with exit $LASTEXITCODE" }
          & .\out\test_stream.exe
          if ($LASTEXITCODE -ne 0) { throw "stream unit tests failed with exit $LASTEXITCODE" }
          & scripts\stream_smoke.ps1 -Port 18097 -ServerExe .\out\pulse_app.exe
          if ($LASTEXITCODE -ne 0) { throw "stream smoke failed with exit $LASTEXITCODE" }
          & scripts\ws_auth_smoke.ps1 -Port 18098
          if ($LASTEXITCODE -ne 0) { throw "ws auth smoke failed with exit $LASTEXITCODE" }
          & scripts\site_smoke.ps1 -Port 18095
          if ($LASTEXITCODE -ne 0) { throw "site smoke failed with exit $LASTEXITCODE" }
          & scripts\fuzz_parsers.ps1 -TimeoutSec 300
          if ($LASTEXITCODE -ne 0) { throw "parser fuzz failed with exit $LASTEXITCODE" }
          & scripts\fuzz_cookie.ps1 -TimeoutSec 300 -AllowKnownCrlf
          if ($LASTEXITCODE -ne 0) { throw "cookie fuzz failed with exit $LASTEXITCODE" }
          & scripts\worker_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "worker smoke failed with exit $LASTEXITCODE" }
          python scripts\scaffold_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "scaffold smoke failed with exit $LASTEXITCODE" }
          & scripts\repro_check.ps1 -TimeoutSec 300
          if ($LASTEXITCODE -ne 0) { throw "repro check failed with exit $LASTEXITCODE" }
