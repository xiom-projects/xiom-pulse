name: PULSE CI

# Tier 1: every pull request + manual dispatch (the org model: heavy soaks
# live in heavy.yml, releases in release.yml). Consumes the pinned,
# SHA256-verified XIOM toolchain and the stdlib checkout at STDLIB_VERSION
# via .github/actions/setup-xiom; the fleet is suites x2 + the 78-check
# HTTP smoke on both platforms.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  XIOM_TOOLCHAIN_VERSION: "v0.64.9"
  XIOM_LINUX_SHA256: "b331dd4d39dc2ef71f6378551c24275e90f29587443e1539c42d739e5e85e5b5"
  XIOM_LINUX_ARM64_SHA256: "2e84a3001c9e26cb50b8a0dcf93de225fd1f2aeb65ceffdb759fe4298d67d491"
  XIOM_WINDOWS_SHA256: "1b7595418455ce0b9cbca15139d6f6e225df6e8788168a1cd21485f6f137f11d"
  XIOM_MACOS_X64_SHA256: "5d7afc5b3c2961dcf4c0cd4b47c5639139450d0b085f323dd9aa2963bcd26ff1"
  XIOM_MACOS_ARM64_SHA256: "63bed569b3508c083d9a8bb9a2c4152fb6f4eb8ca4f9b166d61eb11637526f14"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS witness legs are non-gating until the compiler arm64 IR defect
    # (REL-20261021-0717-pulse) and the stdlib macOS io truncation
    # (REL-20261021-0918-pulse) are fixed. The jobs still run and report.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: macos-14
          - os: macos-15-intel
    steps:
      - name: Checkout PULSE
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup XIOM (toolchain + stdlib + deps)
        uses: ./.github/actions/setup-xiom
        with:
          cross-repo-token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh src/server.xi --name pulse_app --timeout-sec 300

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& scripts\build.ps1 src\server.xi -Name pulse_app'

      - name: Verify arm64 binary (Linux arm64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          file out/pulse_app | tee /tmp/pulse-arm64-file.txt
          grep -q "ARM aarch64" /tmp/pulse-arm64-file.txt

      - name: macOS io witness (pre-fix, non-gating)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/probes/p_io_listdir_roundtrip.xi --name p_io_listdir --timeout-sec 300
          ./out/p_io_listdir
          echo "io-witness rc=$?"

      - name: macOS list_dir fix witness (stdlib 05673f8, pre-pin)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          git -C stdlib fetch --unshallow origin || true
          git -C stdlib fetch origin main
          git -C stdlib checkout 05673f86481ff3786705226020c763e71b5cc941
          export XIOM_STDLIB="$PWD/stdlib"
          bash scripts/build.sh tests/probes/p_io_listdir_roundtrip.xi --name p_io_listdir_fix --timeout-sec 300
          ./out/p_io_listdir_fix
          bash scripts/build.sh tests/test_migrations.xi --name test_migrations_fix --timeout-sec 600
          ./out/test_migrations_fix

      - name: SQLite linkage probe (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/probes/probe_sqlite.xi --name probe_sqlite --timeout-sec 600
          ./out/probe_sqlite

      - name: Migrations runner tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/test_migrations.xi --name test_migrations --timeout-sec 600
          ./out/test_migrations

      - name: SQL store tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/test_sql.xi --name test_sql --timeout-sec 900
          ./out/test_sql

      - name: Build bttger benchmark app (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh benchmarks/bttger/main.xi --name bench_bttger --timeout-sec 300

      - name: Stream unit tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh tests/test_stream.xi --name test_stream --timeout-sec 300
          ./out/test_stream

      - name: Suites x2 + smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for r in 1 2; do
            for s in test_http test_app test_smoke; do
              bash scripts/run.sh "tests/$s.xi" --quiet --timeout-sec 300
            done
          done
          bash scripts/http_smoke.sh --port 18090
          bash scripts/stream_smoke.sh --port 18097 --server-exe ./out/pulse_app

      - name: Suites x2 + smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($r in 1, 2) {
            foreach ($s in @("test_http", "test_app", "test_smoke")) {
              & scripts\run.ps1 "tests\$s.xi" -Quiet
              if ($LASTEXITCODE -ne 0) { throw "suite $s (round $r) failed with exit $LASTEXITCODE" }
            }
          }
          & scripts\http_smoke.ps1 -Port 18090
          if ($LASTEXITCODE -ne 0) { throw "smoke failed with exit $LASTEXITCODE" }
          & scripts\build.ps1 tests\test_stream.xi -Name test_stream -TimeoutSec 300
          if ($LASTEXITCODE -ne 0) { throw "stream unit test build failed with exit $LASTEXITCODE" }
          & .\out\test_stream.exe
          if ($LASTEXITCODE -ne 0) { throw "stream unit tests failed with exit $LASTEXITCODE" }
          & scripts\stream_smoke.ps1 -Port 18097 -ServerExe .\out\pulse_app.exe
          if ($LASTEXITCODE -ne 0) { throw "stream smoke failed with exit $LASTEXITCODE" }
