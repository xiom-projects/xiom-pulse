name: PULSE Heavy Soaks

# Tier 2 (org model): the long soaks run weekly and on demand, off the PR
# path, on both platforms. Soak/probe numbers are evidence, not gates; the
# gates are 0 failures and a clean shutdown.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  XIOM_TOOLCHAIN_VERSION: "v0.65.1"
  XIOM_LINUX_SHA256: "5785320f0b43bdd9d1ac09fa51eb97a249df411c9420cbac7b1669eb88c604bb"
  XIOM_LINUX_ARM64_SHA256: "c4ecb3ac3226f27ded3beb9728742e8e607a34652308c502f4a5b4995c408006"
  XIOM_WINDOWS_SHA256: "69de1e27c9c11074c34d9b06c2dec22b4137bda399f7e2ea65846a069393c3fc"
  XIOM_MACOS_X64_SHA256: "37d7974eace0f21da54d656463d5a15572abe8fb3c1d16400aba87d6b3c69557"
  XIOM_MACOS_ARM64_SHA256: "bfc2e6562923bd348ca4f24a823424cfb185cd8a1e9efc946b0d7122917a259b"

jobs:
  soak:
    name: soak (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - name: Checkout PULSE
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup XIOM (toolchain + stdlib + deps)
        uses: ./.github/actions/setup-xiom
        with:
          cross-repo-token: ${{ secrets.XIOM_CROSS_REPO_TOKEN || github.token }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build.sh src/server.xi --name pulse_app --timeout-sec 300

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& scripts\build.ps1 src\server.xi -Name pulse_app'

      - name: "Soaks (Linux: 30m HTTP, 10m kv store, RSS probe)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/soak_http.sh --seconds 1800 --port 18092
          PULSE_STORE_BACKEND=kv PULSE_KV_DIR="$PWD/probe-logs/heavy-kv-store" \
            bash scripts/store_soak.sh --seconds 600 --port 18089
          bash scripts/rss_probe.sh --seconds 120 --port 18096

      - name: "Soaks (Windows: 30m HTTP, RSS probe)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & scripts\soak_http.ps1 -Seconds 1800 -Port 18092
          if ($LASTEXITCODE -ne 0) { throw "soak failed with exit $LASTEXITCODE" }
          & scripts\rss_probe.ps1 -Seconds 120 -Port 18096
          if ($LASTEXITCODE -ne 0) { throw "rss probe failed with exit $LASTEXITCODE" }
