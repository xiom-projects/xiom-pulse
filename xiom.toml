# XIOM PULSE -- compiler project manifest (xiom.toml is the canonical
# Phase 7 manifest; package.xi remains the registry/pkg manifest).
#
# Dependency resolution (2026-10-08, C-PULSE-02 CLOSED): the shipped
# v0.64.1 compiler resolves canonical dotted `[dependencies]` keys to
# installed package roots under $XIOM_HOME/packages (m212 + m215), so the
# v0.63.1-era absolute-path `source-roots` workaround is RETIRED -- the
# manifest no longer carries machine-specific paths. Verified with a
# no-source-roots build + suites x2 + smoke 73/73 on Windows and Linux.
#
# Install the deps before building: `xiom pkg install` each entry below.
# Unix shipped-installer layouts must keep the pkg store visible to
# xiom_home() -- C-PULSE-13: symlink
# ~/.local/share/xiom/packages -> ~/xiom/packages (or set XIOM_HOME).
[project]
name = "xiom.pulse"
version = "0.1.0"
root = "src"

[dependencies]
"xiom.http" = "0.1.4"
"xiom.cookie" = "0.1.1"
"xiom.jwt" = "0.2.0"
"xiom.router" = "0.1.0"
"xiom.rate" = "0.2.0"
"xiom.metrics" = "0.2.0"
"xiom.http.middleware" = "0.1.0"
"xiom.session" = "0.1.0"
"xiom.static" = "0.1.0"
"xiom.kv" = "0.1.0"

[compiler]
target = "native"
timeout-secs = 300
