# Consumer-verify manifest: xiom.ssl 0.1.0 from the registry (eco-v0.1.189).
# Local to docs/repro/ssl-verify/ -- consumes the INSTALLED registry artifact;
# run from this directory with the pinned v0.64.5 toolchain. The live leg
# additionally needs Git's mingw64 bin on PATH (libssl-3-x64.dll) and the
# fixture paths in SSL_CERT_PATH / SSL_KEY_PATH; without libssl the probe
# runs the SKIP leg. See README.md.
[project]
name = "ssl-verify"
version = "0.1.0"
root = "."

[dependencies]
"xiom.ssl" = "0.1.0"
